[project]
name = "psn-captures-backup"
version = "0.1.0"
description = "Back up PlayStation captures from PSN before the 14-day cloud expiry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27", "python-dotenv>=1.0"]

[project.scripts]
psn-captures-backup = "psn_captures_backup.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/psn_captures_backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["psn_captures_backup"]
mypy_path = "src"
